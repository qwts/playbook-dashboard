name = "playbook-dashboard-auth"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false

# The Worker sits in front of the GitHub Pages origin for the dashboard host.
# DNS for dashboard.qwts.org must be a Cloudflare-proxied record pointing at
# GitHub Pages; the Worker then gates /data/* before the origin is reached.
# One level of subdomain keeps the host inside free Universal SSL coverage.
[[routes]]
pattern = "dashboard.qwts.org/*"
zone_name = "qwts.org"

# Identity records, actor tokens, and the audit log. Created 2026-08-04 with
# `wrangler d1 create playbook-dashboard-auth`; `schema.sql` must be applied
# with `wrangler d1 execute playbook-dashboard-auth --remote --file=schema.sql`.
# The id is a resource name, not a secret — access rides on the account.
[[d1_databases]]
binding = "DB"
database_name = "playbook-dashboard-auth"
database_id = "97eaffdf-c3a0-4c03-8cda-dea857d423d0"

[vars]
# Empty = pass through to the zone origin (correct for CF-proxied GitHub Pages).
# Set to a full origin (e.g. https://local.dev.zts1.com:8443) for `wrangler dev`.
PAGES_ORIGIN = ""
SESSION_TTL_SECONDS = "28800"

# Owners a privileged action may name. The App installation is the real
# boundary; this is the cheap check in front of it.
ALLOWED_OWNERS = "qwts"

# A session may read for SESSION_TTL_SECONDS and act for this long. Acting on
# an eight-hour-old cookie is the case this refuses.
PRIVILEGED_MAX_AGE_SECONDS = "3600"

# Privileged attempts per identity per minute, counted from the audit log.
PRIVILEGED_RATE_LIMIT = "10"

# Secrets (wrangler secret put <NAME>) — never commit these:
#   SESSION_SECRET        random 32+ byte string, signs session and tx cookies
#   GITHUB_CLIENT_ID      GitHub *App* client id (not an OAuth App — see below)
#   GITHUB_CLIENT_SECRET  GitHub App client secret
#   APPLE_CLIENT_ID       Apple Services ID (e.g. com.zts1.dashboard.web)
#   APPLE_TEAM_ID         Apple Developer team id
#   APPLE_KEY_ID          Apple Sign In key id (.p8 key id)
#   APPLE_PRIVATE_KEY     Contents of the AuthKey_XXXX.p8 (PKCS8 PEM)
#   GOOGLE_CLIENT_ID      Google OAuth 2.0 Web application client id
#   GOOGLE_CLIENT_SECRET  Google OAuth 2.0 Web application client secret
#   TOKEN_ENCRYPTION_KEY  random 32+ byte string, seals actor tokens in D1
#   ADMIN_SUBJECTS        space/comma separated provider:subject pairs, e.g.
#                         "github:1234567" — unset means nobody is privileged
#
# GITHUB_CLIENT_ID must belong to a GitHub App with "Pull requests: read and
# write", "expire user authorization tokens" enabled, and a callback of
# https://dashboard.qwts.org/auth/callback. An OAuth App's credentials still
# sign people in, and every privileged call then fails at GitHub — the App is
# what makes the token expire, refresh, and stay inside its installation.
