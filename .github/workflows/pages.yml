name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect redacted snapshot
        id: collect
        continue-on-error: true
        env:
          # Fine-grained PAT with security-alert + actions read across governed repos.
          # Default GITHUB_TOKEN cannot read Dependabot/code-scanning alerts on other repos.
          GITHUB_TOKEN: ${{ secrets.FLEET_DASHBOARD_TOKEN }}
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "FLEET_DASHBOARD_TOKEN unset — keeping committed fixture snapshot"
            exit 1
          fi
          npm run collect
      - name: Note fixture fallback
        if: steps.collect.outcome != 'success'
        run: echo "Deploying with public/data/snapshot.json fixture (collector skipped or failed)."
      - run: npm run build
        env:
          VITE_BASE: /
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
