name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# No ambient grants. Every job below states exactly what its own work needs, so
# no step can reach a permission it has no use for. In particular, the job that
# holds the fleet PAT holds nothing else, and the jobs that can mint an OIDC
# token or write to Pages never see the PAT.
permissions: {}

# Deliberately not cancelling, and this is the considered answer rather than the
# inherited default. Cancelling would interrupt `deploy-pages` mid-flight, and
# the queue argument for accepting that risk does not survive the per-job
# `timeout-minutes` below: Actions holds at most one pending run per group — a
# newer arrival replaces the pending one rather than stacking behind it — so the
# ceiling is one running plus one queued, and a run can no longer occupy the
# group for the default six hours. Bounded runs made this the cheaper option.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Holds FLEET_DASHBOARD_TOKEN. `contents: read` and nothing more: no
  # pages:write to deploy with, and no id-token:write to mint an OIDC token
  # asserting this repository's identity.
  collect:
    runs-on: ubuntu-latest
    # ~2 minutes in practice, and every request inside it already carries its own
    # 10s deadline. This bounds the shapes that deadline cannot: a wedged runner,
    # a hung npm ci, a step waiting on something that never arrives. The default
    # is 360 — six hours holding a concurrency group that does not cancel, on an
    # hourly schedule, while holding the fleet credential.
    timeout-minutes: 10
    # Declares no `url`, so it reports no site. It does still create a
    # `github-pages` deployment record — GitHub creates one before evaluating
    # the branch policy, then fails it — so `main` sees two records per run
    # rather than one. Cosmetic: `collect` runs first, so `deploy`'s record
    # stays the latest and remains the Active deployment.
    #
    # The environment is here only for its branch policy, which is main-only,
    # and which was doing unadvertised security work before this workflow was
    # split: it sat on the single collect-and-deploy job, so a run from any
    # other ref was refused before its first step and the PAT never reached a
    # runner.
    #
    # Splitting the jobs moved that gate onto `deploy` alone and left the
    # credential reachable from any branch via workflow_dispatch — write access
    # would have implied running modified collector code against the fleet
    # credential, which ruleset-protected `main` otherwise prevents.
    #
    # The cost is real: the collect job can no longer be smoke-tested from a
    # branch. That is the correct trade. Verifying a workflow is worth less than
    # not being able to run the fleet credential off main.
    environment:
      name: github-pages
    permissions:
      contents: read
    outputs:
      # A string 'true'/'false' — collection status has to cross the job
      # boundary as data, because the step is allowed to fail without failing
      # the job (see the deploy job's final step).
      #
      # `outcome`, not `conclusion`. With `continue-on-error: true` the step's
      # conclusion is reported as success even when the step failed — that is
      # what the flag does — so `conclusion` would report every dead credential
      # and every collection failure as a fresh snapshot, silently reinstating
      # the exact bug this output exists to prevent. `outcome` is the result
      # before the flag is applied. Pinned by a test in tools/workflows.test.mjs.
      fresh: ${{ steps.collect.outcome == 'success' }}
      # Distinct from `fresh`, because "collected nothing" and "collected less
      # than it should have" want opposite handling: the first publishes the
      # committed fixture, the second publishes the degraded snapshot and then
      # says so. Written by the collector, which is the only thing that knows.
      degraded: ${{ steps.collect.outputs.degraded }}
      degraded_reason: ${{ steps.collect.outputs.degraded_reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Nothing here uses the git credential after checkout, and persisting
          # it writes GITHUB_TOKEN into .git/config where every later step —
          # and anything they invoke — can read it.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
      # Install lifecycle scripts are arbitrary code from the dependency tree,
      # and this is the one job holding the PAT. Verified the build is
      # unaffected: esbuild resolves its binary through optional platform
      # packages rather than a postinstall.
      - run: npm ci --ignore-scripts
      - name: Collect redacted snapshot
        id: collect
        continue-on-error: true
        env:
          # Fine-grained PAT with security-alert + actions read across governed repos.
          # Default GITHUB_TOKEN cannot read Dependabot/code-scanning alerts on other repos.
          GITHUB_TOKEN: ${{ secrets.FLEET_DASHBOARD_TOKEN }}
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "FLEET_DASHBOARD_TOKEN unset — the build will use the committed fixture"
            exit 1
          fi
          npm run collect
      - name: Hand the fresh snapshot to the build
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: snapshot
          path: public/data/snapshot.json
          if-no-files-found: error
          retention-days: 1

  # Never sees the PAT. Holds id-token:write only because the attestation needs
  # it to sign, and that is precisely why it is not the job with the credential.
  # Runs the build toolchain — vite, esbuild, and every plugin in the tree — and
  # therefore holds no signing grant. `--ignore-scripts` closes *install*-time
  # execution and does nothing about *build*-time execution, which is the whole
  # purpose of a bundler. Attestation moved to its own job; see `attest`.
  build:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # When collection failed there is no artifact, and the committed fixture
      # from checkout is what gets built — deliberately, so a dead credential
      # degrades to stale-but-real rather than to an outage. The run still goes
      # red; see the deploy job.
      - name: Use the freshly collected snapshot
        if: needs.collect.outputs.fresh == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: snapshot
          path: public/data
      - run: npm run build
        env:
          VITE_BASE: /
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist
      # The same bytes again, as individual files rather than the Pages tarball,
      # so the job that signs can attest each one without ever running a build.
      - name: Hand the built files to the attestation job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: site
          path: dist
          # `upload-pages-artifact` above tars dist wholesale; this action
          # skips dotfiles by default. The two copies must carry the same file
          # set, or a future `.well-known/` or `.vite/` in dist deploys
          # unattested — the exact gap this job exists to close.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Signs, and runs nothing that could abuse the signature: no checkout, no npm,
  # no repository code at all — only SHA-pinned GitHub-owned actions over files
  # this workflow already produced.
  #
  # `id-token: write` mints an OIDC token asserting `repo:qwts/playbook-dashboard`,
  # which matters wherever a cloud role trusts that subject. Nothing in this org
  # trusts it today, and "nothing trusts it today" is exactly the assumption that
  # stops being true without anyone revisiting this file — so the capability does
  # not sit beside the toolchain that executes third-party build code.
  #
  # Separate from `deploy` on purpose. Attesting from `deploy` would need fewer
  # jobs but would attest the Pages *tarball* — one subject instead of many, and
  # `data/snapshot.json` would stop being individually verifiable. This
  # repository's product is auditable claims about security posture; binding the
  # published snapshot by digest to a run of this workflow is that product,
  # not a nicety. Provenance, not freshness — a red run attests its fixture
  # honestly. See DESIGN.md.
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Documented as required by attest-build-provenance. Read access to a
      # public repository grants nothing that is not already public.
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Take the built files without building them
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: site
          path: dist
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/**

  # Holds the Pages grants and nothing else — no PAT, no checkout, no npm.
  deploy:
    needs: [collect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
      # The deploy above is deliberate: a stale-but-real fixture beats an outage.
      # But the run must not be green. `continue-on-error` on the collect step means
      # a dead credential, a revoked permission, or an empty publication set all
      # produced a fully successful run — which is how the published snapshot sat
      # ~20h stale on 2026-07-27 with nothing anywhere reporting a problem.
      #
      # Deploy first, then fail, so the site stays up and the failure is still seen.
      - name: Fail the run when the snapshot was not freshly collected
        if: needs.collect.outputs.fresh != 'true'
        run: |
          echo "::error::Deployed the committed fixture, not a fresh snapshot. \
          The published dashboard is stale. See the 'Collect redacted snapshot' step."
          exit 1
      # The third state. `fresh` only separates "collection failed" from
      # "collection succeeded", so a run that collected successfully while
      # unable to read half the fleet was indistinguishable from a clean one:
      # green check, published page, question marks nobody was told about. That
      # is the same defect as a null count rendering green, one layer up — the
      # UI stopped lying about it in #3, and this stops CI lying about it.
      #
      # Deployed first, like the step above and for the same reason: a snapshot
      # honest about its gaps is still the freshest truth available, and burying
      # it would trade a legible problem for a stale one.
      - name: Fail the run when the collection knew less than it should have
        if: needs.collect.outputs.fresh == 'true' && needs.collect.outputs.degraded == 'true'
        env:
          # Bound, never interpolated into the script body. Counts only, built
          # from the collector's own integers — but a job output is data
          # crossing a boundary, and data crossing a boundary does not get to
          # choose where it lands.
          REASON: ${{ needs.collect.outputs.degraded_reason }}
        run: |
          echo "::error::Published a snapshot the collector could not fully read: ${REASON}. \
          The dashboard is current but incomplete; affected fields show '?' rather than a \
          reassuring zero. Check the fleet token's permissions and the rate-limit budget."
          exit 1
