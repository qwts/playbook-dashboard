name: Auth Worker

# The Worker is the only enforcement point for /data/*, so it gets its own
# gate: a PR typechecks it, a merge to main deploys it. Identity-provider
# secrets are set once with `wrangler secret put` and live only in Cloudflare —
# no run of this workflow ever sees them.

on:
  pull_request:
    paths:
      - 'workers/**'
      - '.github/workflows/worker.yml'
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: workers/dashboard-auth

jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest
    # A typecheck and a single script upload. The default is six hours of
    # runner for a hung install, and DESIGN.md promises every job a bound.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Nothing after checkout uses the git credential; persisting it writes
          # GITHUB_TOKEN into .git/config for every later step to read.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/dashboard-auth/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run ci
      # The deploy credential is account-scoped to Workers Scripts: Edit. It can
      # publish this script and read nothing of the fleet.
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
