name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # ~2 minutes in practice. Lower stakes than pages.yml — no credential, no
    # shared concurrency group — but the default is still six hours of runner
    # for a hung install, and DESIGN.md promises every job a bound.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Nothing after checkout uses the git credential; persisting it writes
          # GITHUB_TOKEN into .git/config for every later step to read.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
      # This job runs the test suite, which is the repo's own code — but the
      # install itself does not need to execute dependency lifecycle scripts.
      - run: npm ci --ignore-scripts
      - run: npm run ci
